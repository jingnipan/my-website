<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>靖成蔬果 Jing Cheng Fresh</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600&display=swap">
<style>
:root{
  --bg:#F4EFEC;
  --bg-alt:#EAF4EB;
  --card:#FFFDFB;
  --border:#CBBBA0;
  --border-soft:#DCD0BC;
  --text:#3A322A;
  --text-soft:#6E6250;
  --text-faint:#8C7F68;
  --green:#7C9885;
  --green-dark:#4E6B58;
  --yellow:#C99A1E;
  --white:#FFFFFF;
  --radius:2px;
  --maxw:1080px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Noto Sans TC',sans-serif;
  font-weight:300;
  line-height:1.9;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Noto Serif TC',serif;
  font-weight:600;
  letter-spacing:.04em;
  margin:0;
  color:var(--text);
}
a{color:inherit;text-decoration:none;}
button{font-family:inherit;cursor:pointer;background:none;}
img{max-width:100%;display:block;}
.container{max-width:var(--maxw);margin:0 auto;padding:0 28px;}
.hidden{display:none !important;}

/* ---------- NAV ---------- */
.nav{
  position:sticky;top:0;z-index:50;
  background:rgba(244,239,236,.92);
  backdrop-filter:blur(6px);
  border-bottom:1px solid var(--border-soft);
}
.nav-inner{
  max-width:var(--maxw);margin:0 auto;padding:14px 28px;
  display:flex;align-items:center;justify-content:space-between;
}
.nav-brand{display:flex;align-items:center;gap:10px;cursor:pointer;}
.nav-brand img{height:48px;width:48px;object-fit:contain;}
.nav-brand span{font-family:'Noto Serif TC',serif;font-weight:700;font-size:17px;letter-spacing:.08em;}
.nav-links{display:flex;gap:6px;align-items:center;}
.nav-link{
  font-size:14.5px;letter-spacing:.05em;padding:8px 14px;
  border:1px solid transparent;border-radius:var(--radius);
  color:var(--text-soft);transition:all .2s;
}
.nav-link:hover,.nav-link.active{
  border-color:var(--border);color:var(--text);
}
.nav-burger{display:none;font-size:22px;border:1px solid var(--border);padding:4px 10px;border-radius:var(--radius);}

@media(max-width:720px){
  .nav-links{
    display:none;position:absolute;top:100%;left:0;right:0;
    background:var(--bg);border-bottom:1px solid var(--border-soft);
    flex-direction:column;align-items:stretch;padding:8px 20px 16px;gap:0;
  }
  .nav-links.open{display:flex;}
  .nav-link{padding:12px 4px;border:none;border-bottom:1px solid var(--border-soft);border-radius:0;}
  .nav-burger{display:block;}
}

/* ---------- GENERIC LAYOUT ---------- */
.section{padding:72px 0;}
.section-tight{padding:40px 0;}
.eyebrow{
  font-size:13px;letter-spacing:.25em;color:var(--green-dark);
  text-transform:uppercase;margin-bottom:14px;font-weight:500;
}
.section-title{font-size:28px;margin-bottom:10px;}
.section-sub{color:var(--text-soft);font-size:15px;max-width:560px;}
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:var(--radius);
  padding:26px;
}
.btn{
  display:inline-block;padding:12px 30px;
  border:1px solid var(--text);border-radius:var(--radius);
  font-size:14px;letter-spacing:.1em;color:var(--text);
  transition:all .25s;
}
.btn:hover{background:var(--text);color:var(--white);}
.btn-green{border-color:var(--green-dark);color:var(--green-dark);}
.btn-green:hover{background:var(--green-dark);color:var(--white);}
.btn-sm{padding:8px 18px;font-size:13px;}

/* ---------- HERO / ENTRY ---------- */
.hero{
  padding:90px 0 70px;text-align:center;
  border-bottom:1px solid var(--border-soft);
  background:
    radial-gradient(ellipse at 20% 20%, var(--bg-alt) 0%, transparent 55%),
    radial-gradient(ellipse at 80% 0%, var(--bg-alt) 0%, transparent 50%);
}
.hero img.logo{height:150px;width:150px;object-fit:contain;margin:0 auto 22px;}
.hero .eyebrow{justify-content:center;display:flex;}
.hero h1{font-size:34px;max-width:640px;margin:0 auto 16px;line-height:1.5;}
.hero p{color:var(--text-soft);font-size:15px;max-width:480px;margin:0 auto 34px;}
.hero-actions{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;}
.hero-links{
  display:flex;gap:18px;justify-content:center;margin-top:40px;flex-wrap:wrap;
}
.hero-links a{
  font-size:13px;letter-spacing:.08em;color:var(--text-soft);
  border-bottom:1px solid var(--border);padding-bottom:2px;
}
.hero-links a:hover{color:var(--green-dark);border-color:var(--green-dark);}

/* ---------- ABOUT ---------- */
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:start;margin-top:40px;}
@media(max-width:800px){.about-grid{grid-template-columns:1fr;}}
.about-figure{
  border:1px solid var(--border);padding:8px;background:var(--card);
}
.about-figure img{width:100%;height:auto;object-fit:contain;background:var(--bg-alt);}
.about-figure figcaption{font-size:13px;color:var(--text-faint);padding:10px 6px 2px;text-align:center;}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--border-soft);border:1px solid var(--border-soft);margin:44px 0;}
.stat{background:var(--bg);text-align:center;padding:26px 10px;}
.stat b{display:block;font-family:'Noto Serif TC',serif;font-size:24px;color:var(--green-dark);}
.stat span{font-size:13px;color:var(--text-soft);letter-spacing:.05em;}
.adv-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:34px;}
@media(max-width:700px){.adv-grid{grid-template-columns:1fr;}}
.adv-item{border:1px solid var(--border-soft);border-left:2px solid var(--green);padding:18px 20px;}
.adv-item h4{font-size:15px;margin-bottom:6px;font-family:'Noto Sans TC',sans-serif;font-weight:600;}
.adv-item p{font-size:14px;color:var(--text-soft);margin:0;}
.about-note{
  margin-top:40px;border:1px dashed var(--border);padding:20px 24px;font-size:14px;color:var(--text-soft);
}

/* ---------- PRODUCT GRID ---------- */
.prod-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:40px;}
@media(max-width:700px){.prod-grid{grid-template-columns:1fr;}}
.prod-card{
  border:1px solid var(--border);background:var(--card);
  overflow:hidden;display:flex;flex-direction:column;transition:border-color .2s;
  cursor:pointer;
}
.prod-card:hover{border-color:var(--green);}
.prod-card .thumb{width:100%;aspect-ratio:1/1;object-fit:contain;background:var(--bg-alt);}
.prod-card .body{padding:22px;flex:1;display:flex;flex-direction:column;}
.prod-card h3{font-size:18px;margin-bottom:8px;}
.prod-card p{font-size:14px;color:var(--text-soft);flex:1;margin:0 0 18px;}
.prod-card .row{display:flex;justify-content:space-between;align-items:center;}
.prod-card .price{font-size:13px;color:var(--green-dark);}
.placeholder-box{
  border:1px dashed var(--border);background:var(--bg-alt);
  padding:40px 20px;text-align:center;color:var(--text-faint);font-size:14px;
}

/* ---------- DETAIL PAGE HEADER ---------- */
.detail-top{padding:44px 0 10px;}
.detail-top .back{font-size:13.5px;color:var(--text-soft);margin-bottom:18px;display:inline-block;}
.detail-top .back:hover{color:var(--green-dark);}
.detail-top h1{font-size:30px;text-align:center;}
.detail-top .short{text-align:center;color:var(--text-soft);font-size:14.5px;margin-top:10px;max-width:520px;margin-left:auto;margin-right:auto;}

/* ---------- BLOCK SYSTEM ---------- */
.blocks-wrap{padding:30px 0 70px;}
.block{
  border:1px solid var(--border);background:var(--card);
  padding:38px 32px;margin-bottom:26px;
}
@media(max-width:600px){.block{padding:30px 20px;}}
.block-head{text-align:center;margin-bottom:26px;}
.block-eyebrow{
  display:block;font-size:11.5px;letter-spacing:.2em;color:var(--green-dark);
  text-transform:uppercase;margin-bottom:8px;
}
.block-title{font-size:20px;}

/* hero block */
.hero-block-img{width:100%;height:auto;max-height:560px;object-fit:contain;border:1px solid var(--border-soft);margin-bottom:26px;background:var(--bg-alt);}
.hero-block-text p{font-size:15px;color:var(--text-soft);margin:0 0 14px;max-width:680px;margin-left:auto;margin-right:auto;text-align:center;}
.hero-checklist{list-style:none;padding:0;margin:22px 0 0;display:flex;flex-wrap:wrap;gap:10px 26px;justify-content:center;}
.hero-checklist li{font-size:13.5px;color:var(--text-soft);}

/* image grid block */
.imggrid{display:grid;gap:16px;}
.imggrid.cols-2{grid-template-columns:1fr 1fr;}
.imggrid.cols-3{grid-template-columns:repeat(3,1fr);}
@media(max-width:700px){.imggrid.cols-2,.imggrid.cols-3{grid-template-columns:1fr;}}
.imggrid figure{margin:0;border:1px solid var(--border-soft);}
.imggrid img{width:100%;height:auto;object-fit:contain;background:var(--bg-alt);}
.imggrid figcaption{font-size:13px;color:var(--text-soft);text-align:center;padding:10px 8px;}

/* variant grid (裸裝/袋裝 type comparison) */
.variant-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
@media(max-width:700px){.variant-grid{grid-template-columns:1fr;}}
.variant-card{border:1px solid var(--border-soft);background:var(--bg);}
.variant-card img{width:100%;height:auto;object-fit:contain;border-bottom:1px solid var(--border-soft);background:var(--bg-alt);}
.variant-card .vbody{padding:20px 22px;}
.variant-card h4{font-size:16px;margin-bottom:6px;}
.variant-card .suit{font-size:13px;color:var(--green-dark);margin-bottom:10px;}
.variant-card ul{margin:0;padding-left:18px;font-size:13.5px;color:var(--text-soft);}
.variant-card .warn{color:#B5763F;font-size:13px;margin-top:8px;}

/* gallery block */
.gallery-figure{border:1px solid var(--border-soft);background:var(--bg);padding:8px;}
.gallery-figure img{width:100%;height:auto;max-height:600px;object-fit:contain;background:var(--bg-alt);}
.gallery-figure figcaption{font-size:13.5px;color:var(--text-soft);padding:14px 10px 4px;text-align:center;}

/* info grid block (規格/配送/運費/付款) */
.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
@media(max-width:700px){.info-grid{grid-template-columns:1fr;}}
.info-card{border:1px solid var(--border-soft);padding:22px 24px;background:var(--bg);}
.info-card .ic-eyebrow{font-size:12px;letter-spacing:.12em;color:var(--green-dark);text-transform:uppercase;margin-bottom:10px;}
.info-card .ic-main{font-size:16px;font-weight:500;margin-bottom:8px;white-space:pre-line;}
.info-card .ic-sub{font-size:13.5px;color:var(--text-soft);white-space:pre-line;}
.price-banner{
  margin-top:26px;border:1px solid var(--green);padding:22px 26px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;
}
.price-banner .label{font-size:13px;color:var(--text-soft);letter-spacing:.05em;margin-bottom:4px;}
.price-banner .value{font-family:'Noto Serif TC',serif;font-size:20px;color:var(--green-dark);}
.price-banner .value.empty{font-family:'Noto Sans TC',sans-serif;font-size:14px;color:var(--text-faint);}

/* list block */
.list-block{margin:0;padding-left:0;list-style:none;max-width:680px;margin-left:auto;margin-right:auto;}
.list-block li{
  padding:12px 0 12px 26px;border-bottom:1px solid var(--border-soft);
  position:relative;font-size:14.5px;color:var(--text-soft);
}
.list-block li:before{content:"–";position:absolute;left:4px;color:var(--green);}
.list-block li:last-child{border-bottom:none;}
.list-block.warn li:before{content:"⚠";color:#B5763F;font-size:12px;}
.list-block.check li:before{content:"✓";color:var(--green-dark);}
.block-note{
  margin-top:20px;border:1px dashed var(--border);padding:18px 22px;
  font-size:13.5px;color:var(--text-soft);max-width:680px;margin-left:auto;margin-right:auto;
}

/* storage (list + image) */
.storage-block{display:grid;grid-template-columns:220px 1fr;gap:26px;align-items:start;}
@media(max-width:650px){.storage-block{grid-template-columns:1fr;}}
.storage-block img{border:1px solid var(--border-soft);width:100%;height:auto;object-fit:contain;background:var(--bg-alt);}
.storage-block .list-block{margin-left:0;margin-right:0;max-width:none;}

/* package grid block (訂購規格選擇) */
.pkg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
@media(max-width:820px){.pkg-grid{grid-template-columns:1fr 1fr;}}
@media(max-width:560px){.pkg-grid{grid-template-columns:1fr;}}
.pkg-card{
  position:relative;border:1px solid var(--border);padding:28px 20px 22px;
  background:var(--bg);display:flex;flex-direction:column;
  cursor:pointer;transition:border-color .2s;
}
.pkg-card:hover{border-color:var(--green);}
.pkg-card.selected{border-color:var(--green-dark);border-width:2px;padding:27px 19px 21px;}
.pkg-tag{
  position:absolute;top:-13px;left:50%;transform:translateX(-50%);
  background:var(--card);border:1px solid var(--green-dark);color:var(--green-dark);
  font-size:12px;padding:4px 12px;border-radius:20px;letter-spacing:.02em;white-space:nowrap;
}
.pkg-badge{
  width:42px;height:42px;border:1.5px solid var(--text);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-family:'Noto Serif TC',serif;font-size:18px;margin:6px auto 16px;flex-shrink:0;
}
.pkg-name{text-align:center;font-size:16.5px;font-weight:600;margin-bottom:4px;}
.pkg-meta{text-align:center;font-size:13.5px;color:var(--text-soft);margin-bottom:16px;}
.pkg-price{text-align:center;font-family:'Noto Serif TC',serif;font-size:24px;color:var(--green-dark);margin-bottom:18px;min-height:30px;}
.pkg-price.empty{font-family:'Noto Sans TC',sans-serif;font-size:13px;color:var(--text-faint);}
.pkg-checklist{list-style:none;padding:0;margin:0 0 0;flex:1;}
.pkg-checklist li{font-size:13px;color:var(--text-soft);padding:6px 0 6px 20px;position:relative;}
.pkg-checklist li:before{content:"✔";position:absolute;left:0;color:var(--green-dark);}
.pkg-selected-note{text-align:center;margin-top:22px;font-size:13.5px;color:var(--green-dark);min-height:20px;}

/* ---------- FOOTER ---------- */
.footer{border-top:1px solid var(--border-soft);padding:50px 0 30px;margin-top:20px;}
.footer-inner{display:flex;justify-content:space-between;flex-wrap:wrap;gap:24px;}
.footer-legal{font-size:12.5px;color:var(--text-faint);line-height:2;}
.footer-links{display:flex;gap:16px;flex-wrap:wrap;}
.footer-links a{
  font-size:13px;color:var(--text-soft);border:1px solid var(--border);border-radius:20px;
  padding:6px 16px;
}
.footer-links a:hover{border-color:var(--green-dark);color:var(--green-dark);}
.footer-bottom{text-align:center;font-size:12.5px;color:var(--text-faint);margin-top:34px;}

/* ---------- ADMIN ---------- */
.admin-gate{max-width:380px;margin:80px auto;text-align:center;}
.admin-gate input{
  width:100%;padding:12px 14px;border:1px solid var(--border);background:var(--card);
  font-size:14px;margin:18px 0;border-radius:var(--radius);color:var(--text);
}
.admin-tabs{display:flex;gap:6px;flex-wrap:wrap;margin:30px 0 26px;border-bottom:1px solid var(--border-soft);padding-bottom:14px;}
.admin-tab{padding:8px 16px;border:1px solid var(--border);font-size:13.5px;border-radius:var(--radius);color:var(--text-soft);}
.admin-tab.active{background:var(--text);color:var(--white);border-color:var(--text);}
.field{margin-bottom:20px;}
.field label{display:block;font-size:13px;color:var(--text-soft);margin-bottom:6px;letter-spacing:.03em;}
.field input[type=text],.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--border);background:var(--card);
  font-family:inherit;font-size:14px;color:var(--text);border-radius:var(--radius);
}
.field textarea{min-height:90px;resize:vertical;line-height:1.7;}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:600px){.field-row{grid-template-columns:1fr;}}
.img-upload{
  border:1px dashed var(--border);padding:14px;display:flex;align-items:center;gap:14px;
}
.img-upload .prev{width:70px;height:70px;object-fit:cover;border:1px solid var(--border-soft);background:var(--bg-alt);flex-shrink:0;}
.img-upload .meta{flex:1;font-size:12.5px;color:var(--text-soft);}
.admin-actionbar{
  position:sticky;bottom:0;background:var(--bg);border-top:1px solid var(--border);
  padding:16px 0;display:flex;gap:12px;justify-content:flex-end;margin-top:20px;
}
.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  background:var(--text);color:var(--white);padding:12px 26px;border-radius:var(--radius);
  font-size:13.5px;letter-spacing:.05em;opacity:0;pointer-events:none;transition:opacity .3s;z-index:200;
}
.toast.show{opacity:1;}
.admin-block-editor{border:1px solid var(--border-soft);padding:22px 22px 4px;margin-bottom:22px;background:var(--card);transition:opacity .2s;}
.admin-block-editor.dragging{opacity:.35;}
.abe-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;cursor:grab;}
.abe-title{font-size:13px;letter-spacing:.1em;color:var(--green-dark);text-transform:uppercase;}
.abe-controls{display:flex;gap:6px;}
.abe-btn{border:1px solid var(--border);background:var(--card);padding:4px 11px;border-radius:var(--radius);font-size:14px;cursor:pointer;color:var(--text-soft);}
.abe-btn:hover{border-color:var(--green-dark);color:var(--green-dark);}
.abe-btn:disabled{opacity:.3;cursor:not-allowed;}
.abe-btn:disabled:hover{border-color:var(--border);color:var(--text-soft);}
.admin-hint{font-size:12.5px;color:var(--text-faint);margin-top:-4px;margin-bottom:18px;}
.admin-subitem{border:1px dashed var(--border-soft);padding:16px;margin-bottom:14px;}
.admin-subitem-title{font-size:12.5px;color:var(--text-faint);margin-bottom:10px;letter-spacing:.05em;}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <div class="nav-brand" data-nav="home">
      <img id="navLogo" src="" alt="靖成蔬果">
      <span>靖成蔬果</span>
    </div>
    <div class="nav-links" id="navLinks">
      <a class="nav-link" data-nav="home">首頁</a>
      <a class="nav-link" data-nav="about">靖成介紹</a>
      <a class="nav-link" data-nav="products">蔬果選擇</a>
      <a class="nav-link" data-nav="admin">後台管理</a>
    </div>
    <button class="nav-burger" id="burgerBtn">☰</button>
  </div>
</nav>

<main id="app"></main>

<div class="toast" id="toast"></div>

<script>
/* ============================================================

function bHero(title, image, paragraphs, checklist){

function bVariantGrid(title, variants){
  return {type:"variantGrid", title, variants: variants||[]};
}
function bGallery(title, image, caption){
  return {type:"gallery", title, image, caption: caption||""};
}
function bInfoGrid(title, cards, priceLabel, priceValue){
  return {type:"infoGrid", title, cards: cards||[], priceLabel: priceLabel||"價格資訊", priceValue: priceValue||""};

function bList(title, style, items, note){
  return {type:"list", title, style: style||"plain", items: items||[], note: note||""};

  return {type:"storage", title, image, items: items||[], note: note||""};
}

  return {type:"packageGrid", title, packages: packages||[], note: note||""};
}

/* ---------- deep merge helper ---------- */
function deepMerge(base, override){
  if(Array.isArray(base)) return (override !== undefined) ? override : base;
  if(typeof base === "object" && base !== null){
    const out = {...base};
    if(override && typeof override === "object"){
      for(const k in override){
        out[k] = deepMerge(base[k], override[k]);
      }
    }
    return out;
  }
  return (override !== undefined && override !== null) ? override : base;
}

/* ---------- storage load/save ---------- */
async function loadContent(){
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value){
      const saved = JSON.parse(res.value);
      content = deepMerge(JSON.parse(JSON.stringify(DEFAULT_CONTENT)), saved);
      render();
    }
  }catch(e){
    console.log("尚無雲端資料，使用預設內容");
  }
}
async function saveContent(){
  try{
    const result = await window.storage.set(STORAGE_KEY, JSON.stringify(content), true);
    if(result){ showToast("已儲存，網站內容更新成功"); }
    else{ showToast("儲存失敗，請再試一次"); }
  }catch(e){
    showToast("儲存發生錯誤：" + e.message);
  }
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 2600);
}

/* ---------- navigation ---------- */
function navigate(page, productId){
  route = {page, productId: productId || null};
  document.getElementById("navLinks").classList.remove("open");
  window.scrollTo({top:0, behavior:"instant"});
  render();
}
document.addEventListener("click", (e)=>{
  const el = e.target.closest("[data-nav]");
  if(el){ navigate(el.getAttribute("data-nav")); }
  const pel = e.target.closest("[data-product]");
  if(pel){ navigate("detail", pel.getAttribute("data-product")); }
  const pkgEl = e.target.closest("[data-pkg-select]");
  if(pkgEl){
    const pid = pkgEl.getAttribute("data-pkg-product");
    const badge = pkgEl.getAttribute("data-pkg-select");
    pkgSelected[pid] = (pkgSelected[pid] === badge) ? null : badge;
    render();
  }
});

});

/* ---------- image resize helper for uploads ---------- */
function resizeImageFile(file, maxWidth=1800, quality=0.93){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxWidth){ h = Math.round(h * (maxWidth/w)); w = maxWidth; }
        const canvas = document.createElement("canvas");
        canvas.width = w; canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* ---------- render router ---------- */
function render(){

  document.querySelectorAll(".nav-link").forEach(l=>{

  });
  const app = document.getElementById("app");
  if(route.page==="home") app.innerHTML = renderHome();
  else if(route.page==="about") app.innerHTML = renderAbout();
  else if(route.page==="products") app.innerHTML = renderProducts();
  else if(route.page==="detail") app.innerHTML = renderDetail(route.productId);
  else if(route.page==="admin") app.innerHTML = renderAdmin();
  app.appendChild(makeFooter(route.page!=="admin"));
  if(route.page==="admin") bindAdminEvents();
}

/* ---------- utils ---------- */
function esc(str){
  if(str===undefined || str===null) return "";
  return String(str)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function escAttr(str){ return esc(str).replace(/"/g,"&quot;"); }
function nl2br(str){ return String(str).replace(/\n/g,"<br>"); }

/* ---------- block reorder ---------- */
function moveBlock(id, index, direction){
  const blocks = content.products[id].blocks;
  const newIndex = index + direction;
  if(newIndex < 0 || newIndex >= blocks.length) return;
  const tmp = blocks[index];
  blocks[index] = blocks[newIndex];
  blocks[newIndex] = tmp;
  render();
}
function reorderBlock(id, fromIndex, toIndex){
  if(fromIndex === toIndex) return;
  const blocks = content.products[id].blocks;
  const [moved] = blocks.splice(fromIndex, 1);
  blocks.splice(toIndex, 0, moved);
  render();
}

/* ---------- admin data binding ---------- */
function setPath(obj, path, value){
  const parts = path.split(".");
  let cur = obj;
  for(let i=0;i<parts.length-1;i++){
    const key = isNaN(parts[i]) ? parts[i] : Number(parts[i]);
    if(cur[key]===undefined) cur[key] = isNaN(parts[i+1]) ? {} : [];
    cur = cur[key];
  }
  const lastKey = isNaN(parts[parts.length-1]) ? parts[parts.length-1] : Number(parts[parts.length-1]);
  cur[lastKey] = value;
}

function bindAdminEvents(){
  const pwSubmit = document.getElementById("pwSubmit");
  if(pwSubmit){
    const tryLogin = ()=>{
      const val = document.getElementById("pwInput").value;
      if(val === ADMIN_PASSWORD){
        adminUnlocked = true;
        render();
      }else{
        document.getElementById("pwError").textContent = "密碼錯誤，請再試一次";
      }
    };
    pwSubmit.addEventListener("click", tryLogin);
    document.getElementById("pwInput").addEventListener("keydown", (e)=>{
      if(e.key==="Enter") tryLogin();
    });
    return;
  }

  document.querySelectorAll("[data-admtab]").forEach(t=>{
    t.addEventListener("click", ()=>{
      adminTab = t.getAttribute("data-admtab");
      render();
    });
  });

  document.querySelectorAll("[data-bind]").forEach(el=>{
    el.addEventListener("input", ()=>{
      setPath(content, el.getAttribute("data-bind"), el.value);
      const prev = document.querySelector(`[data-imgprev="${el.getAttribute("data-bind")}"]`);
      if(prev) prev.src = el.value;
    });
  });
  document.querySelectorAll("[data-bind-list]").forEach(el=>{
    el.addEventListener("input", ()=>{
      const arr = el.value.split("\n").map(s=>s.trim()).filter(s=>s.length>0);
      setPath(content, el.getAttribute("data-bind-list"), arr);
    });
  });
  document.querySelectorAll("[data-imgfile]").forEach(el=>{
    el.addEventListener("change", async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      showToast("圖片處理中…");
      try{
        const dataUrl = await resizeImageFile(file);
        const path = el.getAttribute("data-imgfile");
        setPath(content, path, dataUrl);
        const prev = document.querySelector(`[data-imgprev="${path}"]`);
        if(prev) prev.src = dataUrl;
        const textInput = document.querySelector(`[data-bind="${path}"]`);
        if(textInput) textInput.value = dataUrl;
        showToast("圖片已套用，記得按「儲存變更」");
      }catch(err){
        showToast("圖片處理失敗");
      }
    });
  });

  document.getElementById("saveBtn").addEventListener("click", saveContent);
  document.getElementById("resetBtn").addEventListener("click", ()=>{
    if(!confirm("確定要將此區塊重置為預設內容嗎？（尚未儲存前可還原）")) return;
    if(adminTab==="general"){
      content.tagline = DEFAULT_CONTENT.tagline;
      content.about = JSON.parse(JSON.stringify(DEFAULT_CONTENT.about));
      content.officialSite = DEFAULT_CONTENT.officialSite;
      content.social = JSON.parse(JSON.stringify(DEFAULT_CONTENT.social));
      content.legal = JSON.parse(JSON.stringify(DEFAULT_CONTENT.legal));
    }else{
      content.products[adminTab] = JSON.parse(JSON.stringify(DEFAULT_CONTENT.products[adminTab]));
    }
    render();
  });
}

/* ---------- init ---------- */
render();
loadContent();
</script>
</body>
</html>
